plugins {
	id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.marda.arch.hex'
version = '0.0.1-SNAPSHOT'
description = 'Configuration'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
    mavenCentral()
}

bootJar {
    mainClass = 'com.marda.arch.hex.app_be_appointment_management_configuration.AppBeAppointmentManagementApplication'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation project(':app-be-appointment-management-domain')
    implementation project(':app-be-appointment-management-application')
    implementation project(':app-be-appointment-management-adapter-out-dbs-sql-mysql')
    implementation project(':app-be-appointment-management-adapter-in-rest')
//    implementation project(':app-be-appointment-management-commons')
}